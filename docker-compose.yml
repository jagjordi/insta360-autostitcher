# Insta360 autostitcher stack

services:
  backend:
    build:
      context: ./backend
      args:
        - MEDIA_SDK_DEB=${MEDIA_SDK_DEB:-vendor/libmediasdk.deb}
        - AI_STITCH_MODEL=${AI_STITCH_MODEL:-vendor/ai_stitch_model_v2.ins}
    container_name: insta360-backend
    env_file:
      - .env
    environment:
      APP_STORAGE_DIR: /app
      AUTO_STITCHER_LOG_LEVEL: ${AUTO_STITCHER_LOG_LEVEL:-INFO}
      NVIDIA_VISIBLE_DEVICES: all
      # display: lets entrypoint.sh run a headless Xorg on the GPU for GPU stitching
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video,graphics,display
    runtime: nvidia
    ports:
      - "${AUTO_STITCHER_BIND:-0.0.0.0}:${AUTO_STITCHER_PORT:-8008}:8008"
    volumes:
      - ${APP_STORAGE_DIR}:/app
      # Mount the NFS share root; /app/raw and /app/stitched are symlinks into it (see .env).
      - ${MEDIA_SHARE_DIR}:/unraid

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE=${VITE_API_BASE:-}
    container_name: insta360-frontend
    network_mode: host
    environment:
      NGINX_LISTEN: ${NGINX_LISTEN:-0.0.0.0}
      NGINX_PORT: ${NGINX_PORT:-3000}
      API_PROXY_TARGET: ${BACKEND_API_URL:-http://127.0.0.1:8000}
